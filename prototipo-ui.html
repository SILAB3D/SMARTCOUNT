<style>
:root{
  --bg:#fff; --surface:#f7f7f8; --text:#07070a; --text2:#74747a;
  --divider:#ededf0; --chip:#f2f2f4; --chipSel:#07070a; --chipSelText:#fff;
  --pos:#00b862; --neg:#ff3b3b; --brand:#3355e6; --pad:20px;
  --savingsTint:#ebefff;
}
[data-theme="dark"]{
  --bg:#000; --surface:#0e0e10; --text:#fff; --text2:#8a8a8e;
  --divider:#1c1c1e; --chip:#161618; --chipSel:#fff; --chipSelText:#000;
  --pos:#00c46a; --neg:#ff4d4d; --brand:#4a6cff; --savingsTint:#14192e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  font-size:15px;line-height:1.35;}
#app{max-width:430px;margin:0 auto;height:100vh;max-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);position:relative;overflow:hidden}
.screen{flex:1;min-height:0;overflow-y:auto;padding-bottom:24px;}
.screen.hasfab{padding-bottom:110px;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{font-size:32px;font-weight:600;letter-spacing:-.8px;margin:0}
.title-row{display:flex;justify-content:space-between;align-items:center;padding:var(--pad)}
.hero{padding:8px var(--pad)}
.hero .num{font-size:44px;font-weight:600;letter-spacing:-1.4px;line-height:1.08}
.hero .lbl{color:var(--text2);font-size:15px;margin-top:6px}
.sub{color:var(--text2);font-size:13px;padding:0 var(--pad)}
.section{padding:14px var(--pad) 10px;color:var(--text2);font-size:13px;
  font-weight:500;letter-spacing:.6px;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center}
.pills{display:flex;gap:8px;padding:0 var(--pad);overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border:0;border-radius:100px;padding:10px 16px;font-size:15px;
  font-weight:500;background:var(--chip);color:var(--text2);cursor:pointer;
  transition:background .18s,color .18s;font-family:inherit}
.pill.on{background:var(--chipSel);color:var(--chipSelText)}
.row{display:flex;align-items:center;gap:14px;padding:16px var(--pad);cursor:pointer}
.row:active{background:var(--chip)}
.av{width:38px;height:38px;border-radius:50%;background:var(--chip);color:var(--text2);
  display:flex;align-items:center;justify-content:center;font-weight:500;flex:0 0 auto}
.row .mid{flex:1;min-width:0}
.row .t{font-size:17px;font-weight:500;letter-spacing:-.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:17px;font-weight:500;letter-spacing:-.2px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--text2)}
.brand{color:var(--brand)}
.mark{display:block}
.div{height:1px;background:var(--divider);margin-left:var(--pad)}
.statrow{padding:12px var(--pad)}
.statrow .line{display:flex;justify-content:space-between;font-size:17px;font-weight:500;letter-spacing:-.2px}
.bar{height:3px;border-radius:100px;background:var(--divider);margin-top:8px;overflow:hidden}
.bar i{display:block;height:3px;background:var(--brand);border-radius:100px;
  transition:width .45s cubic-bezier(.2,.8,.2,1)}
.btn{width:100%;border:0;border-radius:100px;padding:16px;font-size:15px;font-weight:500;
  background:var(--chipSel);color:var(--chipSelText);cursor:pointer;font-family:inherit}
.btn[disabled]{background:var(--chip);color:var(--text2);cursor:default}
.btn2{border:0;border-radius:100px;padding:12px 18px;background:var(--chip);
  color:var(--text);font-weight:500;font-size:15px;cursor:pointer;font-family:inherit}
.fabwrap{position:absolute;left:0;right:0;bottom:60px;padding:28px var(--pad) 16px;
  background:linear-gradient(to bottom,transparent,var(--bg) 45%,var(--bg))}
.tabs{display:flex;border-top:1px solid var(--divider);background:var(--bg)}
.tab{flex:1;border:0;background:none;padding:10px 0 12px;color:var(--text2);
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:11px;position:relative}
.tab.on{color:var(--text)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.dot{position:absolute;top:8px;right:calc(50% - 16px);width:7px;height:7px;
  border-radius:50%;background:var(--brand)}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;
  pointer-events:none;transition:opacity .22s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);
  border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom:24px}
.sheet.on{transform:translateY(0)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:var(--pad)}
.sheet-head b{font-size:22px;font-weight:600;letter-spacing:-.4px}
.sheet-head span{color:var(--text2);cursor:pointer}
.field{margin:0 var(--pad) 12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
.field input{width:100%;border:1px solid transparent;background:var(--chip);color:var(--text);
  border-radius:14px;padding:14px 16px;font-size:16px;font-family:inherit;outline:none}
.field input:focus{border-color:var(--brand)}
.danger{display:block;width:100%;text-align:center;color:var(--neg);background:none;
  border:0;padding:14px;font-weight:500;cursor:pointer;font-family:inherit;font-size:15px}
.ghost{display:block;width:100%;text-align:center;color:var(--text2);background:none;
  border:0;padding:14px;cursor:pointer;font-family:inherit;font-size:15px}

/* Notificación del sistema simulada */
.notif{position:absolute;left:10px;right:10px;top:10px;background:var(--surface);
  border:1px solid var(--divider);border-radius:22px;padding:14px 16px;z-index:30;
  transform:translateY(-140%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 12px 34px rgba(0,0,0,.35)}
.notif.on{transform:translateY(0)}
.notif .app{font-size:11px;color:var(--text2);letter-spacing:.4px;margin-bottom:6px;
  display:flex;align-items:center;gap:6px}
.notif .nt{font-size:15px;font-weight:600;letter-spacing:-.2px}
.notif .nb{font-size:13px;color:var(--text2);margin-top:2px}
.notif .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.notif .acts button{border:0;background:var(--chip);color:var(--text);border-radius:100px;
  padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.notif .acts button.primary{background:var(--chipSel);color:var(--chipSelText)}
/* Pantalla de inicio con widgets */
.home{height:100%;padding:28px 16px;box-sizing:border-box;background:
  radial-gradient(120% 80% at 20% 0%, #2b3a4a 0%, #101418 55%, #05070a 100%)}
[data-theme="light"] .home{background:
  radial-gradient(120% 80% at 20% 0%, #cfe0f2 0%, #eef2f7 55%, #f7f9fc 100%)}
.wgrid{display:flex;gap:12px;align-items:stretch}
.w-balance{flex:1;background:var(--bg);border-radius:24px;padding:16px}
.w-balance .wg{font-size:13px;color:var(--text2);font-weight:500}
.w-balance .wa{font-size:28px;font-weight:700;letter-spacing:-1px;margin-top:6px}
.w-balance .wl{font-size:12px;color:var(--text2)}
.w-balance .wr{display:flex;gap:8px;margin-top:12px}
.w-balance .wr button{border:0;background:var(--chip);border-radius:100px;padding:8px 12px;
  font-size:13px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit}
.w-add{width:96px;background:var(--chipSel);color:var(--chipSelText);border-radius:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border:0;font-family:inherit}
.w-add .plus{font-size:34px;font-weight:700;line-height:1}
.w-add .lbl2{font-size:13px;font-weight:500}
.homebar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:18px}
.homebar button{border:0;background:var(--chip);color:var(--text);border-radius:100px;
  padding:12px 18px;font-weight:500;cursor:pointer;font-family:inherit;font-size:15px}
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--chipSel);
  color:var(--chipSelText);padding:14px 18px;border-radius:14px;font-size:15px;
  opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{padding:40px var(--pad) 0}
.empty h2{font-size:22px;font-weight:600;letter-spacing:-.4px;margin:0 0 8px}
.empty p{color:var(--text2);margin:0 0 24px}

/* Pantalla de carga: 1 s, la misma animación que el splash de Android */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:100;transition:opacity .22s}
#splash.out{opacity:0;pointer-events:none}

/* --- rejilla de grupos, cifras, donut, ajustes plegables y reparto --- */
.gsearch{padding:0 var(--pad) 12px}
.gsearch input{width:100%;border:0;border-radius:14px;background:var(--chip);color:var(--text);
  padding:14px 16px;font-size:15px;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 var(--pad)}
.card{background:var(--chip);border-radius:20px;padding:16px;cursor:pointer;border:0;
  text-align:left;font-family:inherit;color:var(--text);width:100%}
.card.savings{background:var(--savingsTint)}
.card .ct{font-size:17px;font-weight:500;margin-top:10px}
.card .cn{font-size:22px;font-weight:600;letter-spacing:-.4px;margin-top:10px}
.card .cl{font-size:13px;color:var(--text2)}
.tag{font-size:13px;font-weight:500;letter-spacing:.6px;color:var(--brand);margin-left:6px}
.figs{display:flex;gap:10px;padding:0 var(--pad)}
.fig{flex:1;background:var(--chip);border-radius:14px;padding:10px 12px;min-width:0}
.fig .fl{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig .fv{font-size:17px;font-weight:500;margin-top:4px;white-space:nowrap}
.back{font-size:32px;color:var(--text2);cursor:pointer;padding-right:12px;background:none;border:0;font-family:inherit}
.donut{display:flex;justify-content:center;align-items:center;padding:8px 0;position:relative}
.donut .mid2{position:absolute;text-align:center}
.donut .mid2 b{font-size:22px;font-weight:600;letter-spacing:-.4px}
.donut .mid2 span{display:block;font-size:13px;color:var(--text2)}
.legend{display:flex;align-items:center;gap:12px;padding:10px var(--pad)}
.swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .ll{flex:1;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .lp{font-size:13px;color:var(--text2)}
.legend .lv{font-size:17px;font-weight:500}
.sec{display:flex;justify-content:space-between;align-items:center;padding:18px var(--pad);cursor:pointer}
.sec .st{font-size:17px;font-weight:500}
.sec .ss{font-size:13px;color:var(--text2)}
.updcard{margin:0 var(--pad) 20px;background:var(--savingsTint);border-radius:18px;padding:18px;cursor:pointer}
.updcard .ut{font-size:17px;font-weight:500}
.updcard .us{font-size:13px;color:var(--text2);margin-top:4px}
.updcard .ua{color:var(--brand);font-weight:500;margin-top:14px}
.mrow{display:flex;align-items:center;gap:12px;padding:6px var(--pad)}
.mrow .box{width:22px;height:22px;border-radius:6px;background:var(--chip);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;font-size:13px}
.mrow .box.on{background:var(--chipSel);color:var(--chipSelText)}
.mrow .mn{flex:1;font-size:17px;font-weight:500}
.mrow .mv{font-size:17px;font-weight:500}
.mrow input{width:110px;border:0;border-radius:12px;background:var(--chip);color:var(--text);
  padding:10px 12px;font-size:15px;font-family:inherit;text-align:right}
</style></head><body>

<script>
// ---------------------------------------------------------------------------
// Datos simulados + la misma lógica de Stats.kt
// ---------------------------------------------------------------------------
const M = [
  {uuid:'u-ana', name:'Ana'}, {uuid:'u-ben', name:'Ben'},
  {uuid:'u-cid', name:'Cid'}, {uuid:'u-dee', name:'Dee'}
];
const CATS = [
  ['GROCERIES','🛒','Compra'],['FOOD_AND_DRINK','🍔','Restaurantes'],
  ['RENT_AND_UTILITIES','🏠','Vivienda'],['TRANSPORT','🚕','Transporte'],
  ['ENTERTAINMENT','🎤','Ocio'],['TRAVEL','🛏','Alojamiento'],['OTHER','✋','Otros']
];
const catOf = c => CATS.find(x=>x[0]===c);
let nextId = 100;
// Reparte sin perder céntimos: el resto se distribuye entre los primeros. En la
// app esto ya no viaja en ninguna petición —las asignaciones van en RATIO y las
// reparte el servidor—, pero sigue siendo lo que se enseña antes de guardar.
function splitEvenly(total,n){
  const cents=Math.round(Math.abs(total)*100), base=Math.floor(cents/n), extra=cents%n;
  return Array.from({length:n},(_,i)=>(base+(i<extra?1:0))/100);
}
/**
 * Un movimiento. `fixed` son las partes puestas a mano; el resto se reparte lo
 * que quede, igual que hace el servidor con las asignaciones en RATIO.
 */
const mk = (desc,amt,owner,split,cat,date,type='NORMAL',fixed={})=>{
  const sign = type==='INCOME' ? 1 : -1;
  const libres = split.filter(u=>fixed[u]===undefined);
  const fijado = split.reduce((s,u)=>s+(fixed[u]!==undefined?Math.abs(fixed[u]):0),0);
  const resto = splitEvenly(Math.max(amt-fijado,0), libres.length||1);
  let k=0;
  return {
    id:nextId++, uuid:'tx-'+(nextId), description:desc,
    amount:{value:(sign*amt).toFixed(2),currency:'EUR'},
    ownerUuid:owner, date:date, status:'ACTIVE', type:type, category:cat,
    allocations:split.map(u=>({
      membershipUuid:u,
      type: fixed[u]!==undefined ? 'AMOUNT' : 'RATIO',
      amount:{value:(sign*(fixed[u]!==undefined?Math.abs(fixed[u]):resto[k++])).toFixed(2),currency:'EUR'}
    }))
  };
};
/** Transferencia: en negativo, quien recibe se lo lleva entero. */
const mkTransfer=(desc,amt,from,to,date)=>({
  id:nextId++, uuid:'tx-'+(nextId), description:desc,
  amount:{value:(-amt).toFixed(2),currency:'EUR'},
  ownerUuid:from, date:date, status:'ACTIVE', type:'BALANCE', category:null,
  allocations:[
    {membershipUuid:to,type:'RATIO',amount:{value:(-amt).toFixed(2),currency:'EUR'}},
    {membershipUuid:from,type:'AMOUNT',amount:{value:'0.00',currency:'EUR'}}
  ]
});
const ALL=['u-ana','u-ben','u-cid','u-dee'];
const SAV=[{uuid:'u-ingresos',name:'Ingresos'},{uuid:'u-ana',name:'Ana'}];
const G = [
 {id:7,title:'Piso Salamanca',emoji:'🏠',currency:'EUR',status:'READ_WRITE',
  activeMembershipUuid:'u-ana',members:M,transactions:[
   mk('Alquiler septiembre',900,'u-ana',ALL,'RENT_AND_UTILITIES','2026-09-01 09:12:00'),
   mk('Compra semanal',86.40,'u-ben',ALL,'GROCERIES','2026-09-03 19:40:00'),
   mk('Luz agosto',124.15,'u-ana',ALL,'RENT_AND_UTILITIES','2026-08-28 11:02:00'),
   mk('Cena tailandés',68.00,'u-cid',['u-ana','u-cid','u-dee'],'FOOD_AND_DRINK','2026-08-22 22:10:00'),
   mk('Internet agosto',39.90,'u-dee',ALL,'RENT_AND_UTILITIES','2026-08-05 10:00:00'),
   mk('Compra Mercadona',52.30,'u-ana',ALL,'GROCERIES','2026-08-02 18:20:00'),
  ]},
 {id:8,title:'Viaje Lisboa',emoji:'✈️',currency:'EUR',status:'READ_WRITE',
  activeMembershipUuid:'u-ana',members:M.slice(0,3),transactions:[
   mk('Hotel 3 noches',330,'u-ana',['u-ana','u-ben','u-cid'],'TRAVEL','2026-07-18 15:00:00'),
   mk('Vuelos',285.60,'u-ben',['u-ana','u-ben','u-cid'],'TRANSPORT','2026-07-02 08:30:00'),
   mk('Cena Time Out',74.20,'u-cid',['u-ana','u-ben','u-cid'],'FOOD_AND_DRINK','2026-07-19 21:45:00'),
  ]},
 {id:9,title:'Ahorro casa',emoji:'🐖',currency:'EUR',status:'READ_WRITE',
  activeMembershipUuid:'u-ana',members:SAV,savings:true,transactions:[
   mk('Nómina septiembre',1200,'u-ingresos',['u-ana'],null,'2026-09-01 08:00:00','INCOME'),
   mk('Muebles',340.50,'u-ana',['u-ana'],'SHOPPING','2026-09-02 17:30:00'),
   mk('Nómina agosto',1200,'u-ingresos',['u-ana'],null,'2026-08-01 08:00:00','INCOME'),
  ]}
];
// Etiquetas de los tipos que reconoce el parser
const KIND_LABEL = {
  BIZUM_RECEIVED:'Bizum recibido', BIZUM_SENT:'Bizum enviado',
  TRANSFER_RECEIVED:'Transferencia recibida', TRANSFER_SENT:'Transferencia enviada',
  CARD_SPEND:'Pago con tarjeta', CARD_ADJUSTMENT:'Pago ajustado',
  DIRECT_DEBIT:'Recibo domiciliado', REFUND:'Devolución',
  JOINT_SPEND:'Gasto en cuenta conjunta', JOINT_WITHDRAWAL:'Retirada de cuenta conjunta',
  JOINT_INCOME:'Ingreso en cuenta conjunta',
  INCOME_OTHER:'Ingreso', SPEND_OTHER:'Cargo', UNKNOWN:'Movimiento'
};
const MONEY_IN = new Set(['BIZUM_RECEIVED','TRANSFER_RECEIVED','REFUND','JOINT_INCOME','INCOME_OTHER']);
// Movimientos con la forma exacta de las notificaciones reales
let INBOX = [
 {id:1,detectedAt:Date.parse('2026-09-05T20:14:00'),bankLabel:'Trade Republic',
  pkg:'de.traderepublic.app',rawTitle:'Transfer received',
  rawText:'Ben Torres sent you a Bizum of 25.00 €.',
  amount:25,currency:'EUR',counterparty:'Ben Torres',merchant:null,concept:null,
  kind:'BIZUM_RECEIVED'},
 {id:2,detectedAt:Date.parse('2026-09-05T13:02:00'),bankLabel:'Trade Republic',
  pkg:'de.traderepublic.app',rawTitle:'Lefties',rawText:'Spent €70.94 at Lefties',
  amount:70.94,currency:'EUR',counterparty:'Lefties',merchant:'Lefties',concept:null,
  kind:'CARD_SPEND'},
 {id:3,detectedAt:Date.parse('2026-09-04T09:40:00'),bankLabel:'Revolut',
  pkg:'com.revolut.revolut',rawTitle:'Cuenta Conjunta · Amazon',
  rawText:'Cid ha gastado 75,91 €\nSaldo de EUR: 920,43 €',
  amount:75.91,currency:'EUR',counterparty:'Cid',merchant:'Amazon',concept:null,
  kind:'JOINT_SPEND'},
 {id:4,detectedAt:Date.parse('2026-09-03T14:30:00'),bankLabel:'BBVA',
  pkg:'com.bbva.bbvacontigo',rawTitle:'Recibo cargado',
  rawText:'Se ha cargado en tu cuenta *2492 un adeudo de Simyo de 2,50 EUR.',
  amount:2.5,currency:'EUR',counterparty:'Simyo',merchant:null,concept:null,
  kind:'DIRECT_DEBIT',confidence:'HIGH'},
 // Ninguna regla concreta encaja: se deduce la dirección y se marca "revisar"
 {id:5,detectedAt:Date.parse('2026-09-03T09:05:00'),bankLabel:'Revolut',
  pkg:'com.revolut.revolut',rawTitle:'Suscripción',
  rawText:'Se ha renovado tu suscripción por 3,99 €',
  amount:3.99,currency:'EUR',counterparty:'Suscripción',merchant:'Suscripción',

const r2 = v => Math.round(v*100)/100;
const abs = a => Math.abs(parseFloat(a.value));
const nameOf = (g,u) => (g.members.find(m=>m.uuid===u)||{}).name || '?';
const active = g => g.transactions.filter(t=>t.status==='ACTIVE');

// Un ingreso va al revés que un gasto: quien cobra en nombre del grupo pasa a
// deberle ese dinero al resto. La transferencia (BALANCE) cuenta como gasto,
// porque quien envía el dinero es el propietario del movimiento. El signo con
// el que la API la guarda da igual: aquí se trabaja en valores absolutos.
const signOf = tx => tx.type==='INCOME' ? -1 : 1;
function balances(g){
  const b={}; g.members.forEach(m=>b[m.name]=0);
  active(g).forEach(tx=>{
    const s=signOf(tx);
    const p=nameOf(g,tx.ownerUuid); b[p]=(b[p]||0)+s*abs(tx.amount);
    tx.allocations.forEach(a=>{const n=nameOf(g,a.membershipUuid); b[n]=(b[n]||0)-s*abs(a.amount);});
  });
  Object.keys(b).forEach(k=>b[k]=r2(b[k])); return b;
}
function settlement(g){
  const b=balances(g);
  const cred=Object.entries(b).filter(([,v])=>v>0.005).sort((a,x)=>x[1]-a[1]);
  const deb=Object.entries(b).filter(([,v])=>v<-0.005).map(([k,v])=>[k,-v]).sort((a,x)=>x[1]-a[1]);
  const legs=[]; let i=0,j=0,cl=cred[0]?cred[0][1]:0,dl=deb[0]?deb[0][1]:0;
  while(i<cred.length&&j<deb.length){
    const pay=Math.min(cl,dl);
    if(pay>0.005) legs.push({from:deb[j][0],to:cred[i][0],amount:r2(pay)});
    cl-=pay; dl-=pay;
    if(cl<=0.005){i++;cl=cred[i]?cred[i][1]:0}
    if(dl<=0.005){j++;dl=deb[j]?deb[j][1]:0}
  }
  return legs;
}
// --- Ahorro: lo que sale de la fuente de ingresos entra, lo demás sale ------
const incomeMemberOf = g => g.members.find(m=>m.name==='Ingresos') || null;
const spenderOf = g => g.members.find(m=>m.uuid===g.activeMembershipUuid)
  || g.members.find(m=>m.name!=='Ingresos') || null;
const isIncomeTx = (g,tx) => !!incomeMemberOf(g) && tx.ownerUuid===incomeMemberOf(g).uuid;
function savingsSummary(g){
  let income=0, spent=0;
  active(g).forEach(tx=>{ if(isIncomeTx(g,tx)) income+=abs(tx.amount); else spent+=abs(tx.amount); });
  return {income:r2(income),spent:r2(spent),saved:r2(income-spent)};
}

// --- Estadísticas: el grupo entero o solo tu parte, y por tramo de tiempo ---
const inPeriod = (tx,period) => !period || tx.date.startsWith(period);
/** Lo que cuenta como gasto: en ahorro, todo lo que no venga de los ingresos. */
const expensesOf = (g,period) => active(g).filter(tx =>
  inPeriod(tx,period) && (g.savings ? !isIncomeTx(g,tx) : tx.type==='NORMAL'));
const weight = (tx,mine) => mine
  ? tx.allocations.filter(a=>a.membershipUuid===mine).reduce((s,a)=>s+abs(a.amount),0)
  : abs(tx.amount);
function groupBy(g,keyFn,mine,period){
  const m={};
  expensesOf(g,period).forEach(t=>{const k=keyFn(t); m[k]=(m[k]||0)+weight(t,mine);});
  return Object.entries(m).map(([k,v])=>[k,r2(v)]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]);
}
const totalSpent = (g,mine,period) => r2(expensesOf(g,period).reduce((s,t)=>s+weight(t,mine),0));
const myShare = g => totalSpent(g,g.activeMembershipUuid,'');
const avgTx = (g,period) => {const t=expensesOf(g,period);
  return t.length? r2(t.reduce((s,x)=>s+abs(x.amount),0)/t.length):0;};
const byCategory = (g,mine,period) => groupBy(g,t=>{const c=catOf(t.category);
  return c?c[1]+' '+c[2]:'✋ Otros';},mine,period);
const byPayer = (g,mine,period) => groupBy(g,t=>nameOf(g,t.ownerUuid),null,period);
const MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const shortDate = raw => {const [y,m,d]=raw.slice(0,10).split('-');
  return `${+d} ${MONTHS[+m-1]}` + (+y===2026?'':' '+y);};
const byMonth = (g,mine,period) => groupBy(g,t=>{const [y,m]=t.date.split('-');
  return MONTHS[+m-1]+' '+y;},mine,period);
function periodsOf(gs){
  const months=[...new Set(gs.flatMap(g=>active(g).map(t=>t.date.slice(0,7))))];
  const years=[...new Set(months.map(m=>m.slice(0,4)))];
  return [...years.sort().reverse(), ...months.sort().reverse()];
}

/**
 * Quién hizo el movimiento y a quién afecta. Con pocos se nombran; a partir de
 * cuatro se cuentan, porque una lista recortada no dice ni quiénes son ni
 * cuántos.
 */
function participants(g0,tx){
  const owner=nameOf(g0,tx.ownerUuid), date=shortDate(tx.date);
  if(tx.type==='BALANCE'){
    const to=tx.allocations.find(a=>a.membershipUuid!==tx.ownerUuid);
    return `${owner} → ${to?nameOf(g0,to.membershipUuid):'?'} · ${date}`;
  }
  const verb = tx.type==='INCOME' ? 'recibió' : 'pagó';
  const names = tx.allocations.map(a=>nameOf(g0,a.membershipUuid));
  const total = g0.members.length;
  let who='';
  if(names.length===total && total>2) who=' · entre todos';
  else if(names.length===1) who=` · para ${names[0]}`;
  else if(names.length<=3) who=' · entre '+names.slice(0,-1).join(', ')+' y '+names[names.length-1];
  else if(names.length) who=` · entre ${names.length} personas`;
  return `${owner} ${verb}${who} · ${date}`;
}

/** Las porciones del anillo, con «Otros» a partir de la sexta. */
const DONUT = 5;
function donutSlices(rows){
  if(rows.length<=DONUT+1) return rows;
  return [...rows.slice(0,DONUT),['Otros',r2(rows.slice(DONUT).reduce((s,r)=>s+r[1],0))]];
}
const SERIES_LIGHT=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300'];
const SERIES_DARK =['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300'];
const series = () => document.documentElement.getAttribute('data-theme')==='dark'
  ? SERIES_DARK : SERIES_LIGHT;

/**
 * El anillo de categorías. El color identifica y nunca va solo: debajo va la
 * leyenda con el nombre, el porcentaje y el importe de cada porción, que es
 * donde de verdad se comparan dos categorías parecidas.
 */
function donut(rows){
  const slices=donutSlices(rows), total=slices.reduce((s,r)=>s+r[1],0);
  if(!total) return '';
  const pal=series(), R=70, C=2*Math.PI*R;
  let acc=0;
  const arcs=slices.map(([,v],i)=>{
    const frac=v/total, len=Math.max(C*frac-4,2);
    const el=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${pal[i%pal.length]}"
      stroke-width="26" stroke-dasharray="${len} ${C-len}"
      stroke-dashoffset="${-acc*C+1}" transform="rotate(-90 90 90)"></circle>`;
    acc+=frac; return el;}).join('');
  return `<div class="donut" id="donut"><svg width="180" height="180" viewBox="0 0 180 180">${arcs}</svg>
    <div class="mid2"><b>${eur(r2(total))}</b><span>${slices.length} categoría${slices.length===1?'':'s'}</span></div></div>
   ${slices.map(([l,v],i)=>`<div class="legend"><div class="swatch" style="background:${pal[i%pal.length]}"></div>
     <div class="ll">${l}</div><div class="lp">${Math.round(v/total*100)} %</div>
     <div class="lv">${eur(v)}</div></div>`).join('')}`;
}

          ${p.length===4?p:MONTHS[+p.slice(5)-1]+' '+p.slice(0,4)}</button>`).join('')}</div>
      <div style="height:8px"></div>
      ${pills(['Todo el grupo','Mi parte'],i=>(S.statMine?1:0)===i,'setStatMine')}
      <div style="height:16px"></div>
   <div class="hero"><div class="num">${eur(totalSpent(G0,mine,S.statPeriod))}</div>
     <div class="lbl">${S.statMine?'Tu parte en ':'Total gastado en '}${G0.title}</div></div>
   <div class="sub" style="margin-top:6px">media ${eur(avgTx(G0,S.statPeriod))} por gasto</div>
   <div style="height:20px"></div>
   ${pills(['Categoría','Persona','Mes'],i=>S.statTab===i,'setStatTab')}
   <div style="height:12px"></div>`;
  const rows=[byCategory,byPayer,byMonth][S.statTab](G0,mine,S.statPeriod);
  if(!rows.length) return h+`<div class="sub" style="padding:20px">Sin datos en este tramo</div>`;
  if(S.statTab===0) return h+donut(rows);
  const max=Math.max(...rows.map(r=>r[1]),1);
  return h+rows.map(([l,v])=>`<div class="statrow"><div class="line"><span>${l}</span>
     <span>${eur(v)}</span></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join('');
}

function inboxSection(cls,explain){
  const list=inClass(cls);
  if(!list.length) return '';
  return `<div class="section" data-section="${cls}">${CLASS_LABEL[cls]}</div>`
    + (explain?`<div class="sub" style="padding-bottom:6px">${explain}</div>`:'')
    + list.map(e=>{const rec=MONEY_IN.has(e.kind); const d=new Date(e.detectedAt);
        return row({lead:initials(e.merchant||e.counterparty||e.bankLabel),
          title:e.merchant||e.counterparty||e.concept||e.rawTitle,
          sub:`${cls==='BANK'?KIND_LABEL[e.kind]:e.bankLabel}`
            +`${e.confidence==='LOW'&&cls==='BANK'?' · revisar':''}`
            +`${S.classes[e.id]?' · a mano':''}`
            +` · ${d.getDate()} sep · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,
          value:e.amount!=null?eur(rec?e.amount:-e.amount,true):'—',
          cls:cls!=='BANK'?'muted':(rec?'pos':'neg'),
          onclick:`openAssign(${e.id})`});}).join('');
}

function sheetExpense(){
  const G0=openGroup()||g(), f=S.form, ms=G0.members;
  const sav=!!G0.savings;
  const amt=parseFloat((f.amount||'').replace(',','.'));
  const split=(f.split||[]);
  const fijado=split.reduce((s,u)=>s+(f.fixed&&f.fixed[u]!=null&&f.fixed[u]!==''
    ? Math.abs(parseFloat(String(f.fixed[u]).replace(',','.'))||0):0),0);
  const libres=split.filter(u=>!(f.fixed&&f.fixed[u]!=null&&f.fixed[u]!==''));
  const pendiente=r2((amt||0)-fijado);
  const error = !amt||f.kind==='BALANCE'||sav ? null
    : (!libres.length && pendiente>0.005 ? `Faltan ${eur(pendiente)} por asignar`
      : (pendiente<-0.005 ? `Las partes se pasan en ${eur(-pendiente)}` : null));
  const valid=(f.desc||'').trim() && amt>0 && !error &&
    (f.kind==='BALANCE' ? f.to && f.to!==f.payer : (sav || split.length));
  const partes = amt>0&&split.length ? splitEvenly(Math.max(amt-fijado,0),libres.length||1) : [];
  let k=0;
  return `<div class="sheet-head"><b>${S.editing?'Editar movimiento':'Nuevo movimiento'}</b>
    <span onclick="closeSheet()">Cancelar</span></div>
   ${S.editing?'':`<div class="pills">
     ${['NORMAL','INCOME','BALANCE'].filter(k2=>!sav||k2!=='BALANCE').map(k2=>
       `<button class="pill ${f.kind===k2?'on':''}" data-kind="${k2}" onclick="setF('kind','${k2}')">
        ${k2==='NORMAL'?'Gasto':k2==='INCOME'?'Ingreso':'Transferencia'}</button>`).join('')}
     </div><div style="height:12px"></div>`}
   <div class="field"><label>Importe (EUR)</label>
     <input id="f-amount" inputmode="decimal" value="${f.amount||''}" oninput="setF('amount',this.value)"></div>
   <div class="field"><label>Descripción</label>
     <input id="f-desc" value="${(f.desc||'').replace(/"/g,'&quot;')}" oninput="setF('desc',this.value)"></div>
   ${row({id:'date-row',title:'Fecha',value:f.date||'6 de septiembre de 2026',cls:'muted',
          onclick:'pickDate()'})}
   ${sav?`<div class="sub" style="padding-top:12px">${f.kind==='INCOME'
      ? `Entra al grupo desde «${incomeMemberOf(G0).name}» hacia «${spenderOf(G0).name}».`
      : `Sale del grupo a nombre de «${spenderOf(G0).name}».`}</div>`
    :`<div class="section">${f.kind==='INCOME'?'Recibido por':f.kind==='BALANCE'?'De':'Pagado por'}</div>
      <div class="pills">${ms.map(m=>`<button class="pill ${f.payer===m.uuid?'on':''}"
        onclick="setF('payer','${m.uuid}')">${m.name}</button>`).join('')}</div>
      ${f.kind==='BALANCE'?`<div class="section">A</div>
        <div class="pills">${ms.map(m=>`<button class="pill ${f.to===m.uuid?'on':''}"
          onclick="setF('to','${m.uuid}')">${m.name}</button>`).join('')}</div>`
       :`<div class="section">Repartido entre
          <span style="text-transform:none;cursor:pointer" onclick="toggleAll()">
          ${split.length===ms.length?'Quitar todos':'Todos'}</span></div>
         <div class="pills">
           <button class="pill ${f.mode!=='AMOUNTS'?'on':''}" id="mode-even"
             onclick="setMode('EVEN')">A partes iguales</button>
           <button class="pill ${f.mode==='AMOUNTS'?'on':''}" id="mode-amounts"
             onclick="setMode('AMOUNTS')">Por cantidades</button></div>
         <div style="height:8px"></div>
         ${ms.map(m=>{const inc=split.includes(m.uuid);
           const fx=f.fixed&&f.fixed[m.uuid]!=null?f.fixed[m.uuid]:'';
           const share=!inc?'—':(amt>0?eur(fx!==''?Math.abs(parseFloat(String(fx).replace(',','.'))||0):(partes[k++]||0)):'—');
           return `<div class="mrow" data-member="${m.uuid}">
             <div class="box ${inc?'on':''}" onclick="toggleSplit('${m.uuid}')">${inc?'✓':''}</div>
             <div class="mn" onclick="toggleSplit('${m.uuid}')">${m.name}</div>
             ${f.mode==='AMOUNTS'
               ? `<input data-amt="${m.uuid}" inputmode="decimal" placeholder="auto"
                    value="${fx}" oninput="setFixed('${m.uuid}',this.value)">`
               : `<div class="mv ${inc?'':'muted'}">${share}</div>`}</div>`;}).join('')}
         ${f.mode==='AMOUNTS'?`<div class="sub" id="split-note" style="padding-top:10px">${
             error ? error
             : (libres.length&&pendiente>0.005
                ? `${eur(pendiente)} para ${libres.length===1?'el que queda':'los '+libres.length+' que quedan'}`
                : 'Deja en blanco a quien deba repartirse lo que sobre.')}</div>`:''}`}`}
   ${f.kind!=='BALANCE'?`<div class="section">Categoría</div>
     <div class="pills">${CATS.map(c=>`<button class="pill ${f.cat===c[0]?'on':''}"
       onclick="setF('cat','${c[0]}')">${c[1]} ${c[2]}</button>`).join('')}</div>`:''}
   <div style="padding:16px 20px 0">
     <button class="btn" id="save-btn" ${valid?'':'disabled'} onclick="saveExpense()">
       ${S.editing?'Guardar cambios':'Añadir movimiento'}</button>
     ${S.editing?`<button class="danger" onclick="deleteExpense()">Eliminar movimiento</button>`:''}
   </div>`;
}

   <div class="pills">${ms.map(m=>`<button class="pill ${f.payer===m.uuid?'on':''}"

   <div class="section">${f.reimb?'Quién lo recibe':'Repartido entre'}</div>

   <div style="padding:16px 20px 0">

     ${['BANK','OTHER','NON_BANK'].filter(c=>c!==cls).map(c=>`<button class="ghost"

     <button class="ghost" onclick="ignoreEntry()">Ignorar este movimiento</button>

       onclick="muteFromSheet('${(e.merchant||e.counterparty).replace(/'/g,"\\'")}')">

function render(){
  const body={groups:screenGroups,savings:screenSavings,stats:screenStats,
              inbox:screenInbox,settings:screenSettings,home:screenHome}[S.tab]();
  const showFab = (S.tab==='groups'||S.tab==='savings') && openGroup();
  const showTabs = S.tab!=='home';
  const sheetBody = {expense:sheetExpense,assign:sheetAssign,link:sheetLink,ownname:sheetOwnName,
                     add:sheetAdd,create:sheetCreate,manage:sheetManage}[S.sheet]?.() || '';
  document.getElementById('app').innerHTML =
   `<div class="screen ${showFab?"hasfab":""}" id="screen">${body}</div>
    ${showFab?`<div class="fabwrap"><button class="btn" onclick="openCreate()">Añadir movimiento</button></div>`:''}
    ${showTabs?`<div class="tabs">${TABS.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}"
      onclick="tapTab('${k}')">${ICONS[k]}<span>${l}</span>
      ${k==='inbox'&&pendingMovements().length?'<i class="dot"></i>':''}</button>`).join('')}</div>`:''}
    <div class="sheet-bg ${S.sheet?'on':''}" onclick="closeSheet()"></div>
    <div class="sheet ${S.sheet?'on':''}" id="sheet">${sheetBody}</div>
    <div class="toast ${S.toast?'on':''}" id="toast">${S.toast||''}</div>
    ${renderNotif()}`;
}

/**
 * Un toque cambia de pestaña y conserva dónde estabas en ella; dos toques
 * seguidos en la misma vuelven a su ventana principal. El primer toque no
 * puede esperar a ver si llega el segundo: sería un retardo en el gesto más
 * frecuente de la app.
 */
let lastTab=null, lastTapAt=0;
function tapTab(t){
  const now=Date.now(), dbl = t===lastTab && now-lastTapAt<400;
  lastTab=t; lastTapAt=now; S.tab=t;
  if(dbl) popToRoot(t);
  render();
}
/** Cierra la ventana abierta de esa pestaña. Devuelve si había algo que cerrar. */
function popToRoot(t){
  if(t==='groups'&&S.gid!=null){S.gid=null;return true}
  if(t==='savings'&&S.sgid!=null){S.sgid=null;return true}
  return false;
}
/**
 * El botón atrás del móvil. Una hoja abierta se lleva el gesto primero, luego
 * la ventana de la pestaña, y en la ventana principal se cierra la app.
 */
function androidBack(){
  if(S.sheet){closeSheet();return 'sheet'}
  if(popToRoot(S.tab)){render();return 'screen'}
  return 'exit';
}

const selGroup=id=>{S.selId=id;render()};
const openG=id=>{S.selId=id; if(S.tab==='savings') S.sgid=id; else S.gid=id; render()};
const closeG=()=>{popToRoot(S.tab);render()};
const setQuery=v=>{S.query=v;render();
  const el=document.getElementById('g-search');
  if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}};
const setInner=i=>{S.inner=i;render()};
const setStatTab=i=>{S.statTab=i;render()};
const setStatScope=i=>{S.statScope=i;
  const pool=i===0?G.filter(x=>!x.savings):G.filter(x=>x.savings);
  if(!pool.some(x=>x.id===S.selId)) S.selId=pool[0]?pool[0].id:S.selId;
  render()};
const setStatMine=i=>{S.statMine=i===1;render()};
const setPeriod=p=>{S.statPeriod=p;render()};
const toggleSec=k=>{S.secOpen=S.secOpen.includes(k)?S.secOpen.filter(x=>x!==k):[...S.secOpen,k];render()};
const openSheet=s=>{S.sheet=s;S.form={};render()};
const closeSheet=()=>{S.sheet=null;S.editing=null;render()};
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast=null;render()},2200)}
function setF(k,v){S.form[k]=v;render();
  const id = k==='amount'?(S.sheet==='assign'?'a-amount':'f-amount'):null;
  const el=id&&document.getElementById(id);
  if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function setMode(m){S.form.mode=m; if(m==='EVEN') S.form.fixed={}; render();}
function setFixed(u,v){
  S.form.fixed={...(S.form.fixed||[]),[u]:v};
  if(v!==''&&!(S.form.split||[]).includes(u)) S.form.split=[...(S.form.split||[]),u];
  render();
  const el=document.querySelector(`[data-amt="${u}"]`);
  if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function toggleSplit(u){
  const s=S.form.split||[];
  if(S.sheet==='assign'&&S.form.reimb){S.form.split=[u]}
  else {
    S.form.split = s.includes(u)? s.filter(x=>x!==u) : [...s,u];
    if(s.includes(u)&&S.form.fixed) delete S.form.fixed[u];
  }
  render();}
function toggleAll(){const ms=(openGroup()||g()).members.map(m=>m.uuid);
  S.form.split=(S.form.split||[]).length===ms.length?[]:ms;render();}
function pickDate(){S.form.date='1 de septiembre de 2026';render();}
function openCreate(){const G0=openGroup()||g();S.editing=null;S.sheet='expense';
  S.form={kind:'NORMAL',amount:'',desc:'',payer:G0.activeMembershipUuid,
    split:G0.members.map(m=>m.uuid),cat:null,mode:'EVEN',fixed:{}};render();}
function openEdit(id){const G0=openGroup()||g();const tx=G0.transactions.find(t=>t.id===id);
  S.editing=id;S.sheet='expense';
  const fixed={}; tx.allocations.filter(a=>a.type==='AMOUNT')
    .forEach(a=>{fixed[a.membershipUuid]=abs(a.amount).toFixed(2)});
  S.form={kind:tx.type,amount:abs(tx.amount).toFixed(2),desc:tx.description,payer:tx.ownerUuid,
    split:tx.allocations.map(a=>a.membershipUuid),cat:tx.category,
    mode:Object.keys(fixed).length?'AMOUNTS':'EVEN',fixed:fixed,
    to:tx.type==='BALANCE'?(tx.allocations.find(a=>a.membershipUuid!==tx.ownerUuid)||{}).membershipUuid:null};
  render();}
function parsedFixed(f){
  const out={};
  Object.entries(f.fixed||{}).forEach(([u,v])=>{
    if(v!==''&&v!=null&&(f.split||[]).includes(u)){
      const n=parseFloat(String(v).replace(',','.'));
      if(!isNaN(n)) out[u]=n;}});
  return out;}
function saveExpense(){
  const G0=openGroup()||g(),f=S.form,amt=parseFloat(f.amount.replace(',','.'));
  const sav=!!G0.savings;
  const owner = sav ? (f.kind==='INCOME'?incomeMemberOf(G0).uuid:spenderOf(G0).uuid) : f.payer;
  const split = sav ? [spenderOf(G0).uuid] : f.split;
  const fixed = sav ? {} : parsedFixed(f);
  const tx = f.kind==='BALANCE'
    ? mkTransfer(f.desc,amt,f.payer,f.to,'2026-09-06 12:00:00')
    : mk(f.desc,amt,owner,split,f.cat,'2026-09-06 12:00:00',f.kind,fixed);
  if(S.editing){
    const i=G0.transactions.findIndex(t=>t.id===S.editing);
    tx.id=S.editing; tx.date=G0.transactions[i].date; G0.transactions[i]=tx;
    toastAfter('Movimiento actualizado');
  }else{ G0.transactions.push(tx); toastAfter('Movimiento añadido'); }
}
function deleteExpense(){const G0=openGroup()||g();
  G0.transactions=G0.transactions.filter(t=>t.id!==S.editing);toastAfter('Movimiento eliminado');}
function toastAfter(m){S.sheet=null;S.editing=null;render();toast(m);}

/** La propuesta con la que se abre la hoja, igual que AssignPlan en la app. */
function planFor(entry,g0){
  const me=g0.members.find(m=>m.uuid===g0.activeMembershipUuid);
  const other=memberByName(g0,entry.counterparty);
  const p2p=['BIZUM_RECEIVED','BIZUM_SENT','TRANSFER_RECEIVED','TRANSFER_SENT'].includes(entry.kind);
  if(p2p&&me&&other&&other.uuid!==me.uuid)
    return MONEY_IN.has(entry.kind)
      ? {type:'REIMBURSEMENT',payer:other,receiver:me}
      : {type:'REIMBURSEMENT',payer:me,receiver:other};
  return {type:'EXPENSE',payer:me,split:g0.members};}
function memberByName(g0,name){
  if(!name) return null; const n=name.trim().toLowerCase();
  return g0.members.find(m=>m.name.toLowerCase()===n)
      || g0.members.find(m=>{const a=m.name.toLowerCase();
           return n.startsWith(a+' ')||a.startsWith(n.split(' ')[0]+' ');}) || null;}

function openAssign(id,gid){
  const e=INBOX.find(x=>x.id===id); S.assignId=id; S.sheet='assign';
  const G0=G.find(x=>x.id===(gid||S.selId))||G[0];
  const plan=planFor(e,G0);
  S.form={gid:G0.id,reimb:plan.type==='REIMBURSEMENT',
    amount:e.amount!=null?e.amount.toFixed(2):'',
    desc:e.concept||e.merchant||e.counterparty||KIND_LABEL[e.kind],
    payer:plan.payer?plan.payer.uuid:G0.activeMembershipUuid,
    split:plan.type==='REIMBURSEMENT'?[plan.receiver.uuid]:plan.split.map(m=>m.uuid)};
  render();}
function pushEntry(){const f=S.form,G0=G.find(x=>x.id===f.gid);
  const amt=parseFloat(f.amount.replace(',','.'));
  if(G0.savings){
    G0.transactions.push(mk(f.desc,amt,spenderOf(G0).uuid,[spenderOf(G0).uuid],null,'2026-09-06 12:00:00'));
  }else if(f.reimb){
    G0.transactions.push(mkTransfer(f.desc,amt,f.payer,(f.split||[])[0],'2026-09-06 12:00:00'));
  }else{
    G0.transactions.push(mk(f.desc,amt,f.payer,f.split,null,'2026-09-06 12:00:00'));
  }
  INBOX=INBOX.filter(x=>x.id!==S.assignId);toastAfter('Enviado a «'+G0.title+'»');}
function ignoreEntry(){INBOX=INBOX.filter(x=>x.id!==S.assignId);toastAfter('Movimiento ignorado');}
/**
 * Mover de cajón. Marcar como bancario trae consigo a su app; marcar como no
 * bancario la apaga, que es la única forma de que deje de aparecer.
 */
function classify(id,cls){
  const e=INBOX.find(x=>x.id===id); S.classes[id]=cls;
  if(cls==='BANK'){
    if(!S.banks.known.includes(e.pkg)) S.banks.known=[...S.banks.known,e.pkg];
    S.banks.disabled=S.banks.disabled.filter(p=>p!==e.pkg);
    S.banks.seen=S.banks.seen.filter(p=>p!==e.pkg);
    render();
  }else if(cls==='NON_BANK'){
    if(!S.banks.disabled.includes(e.pkg)) S.banks.disabled=[...S.banks.disabled,e.pkg];
    S.sheet=null;render();toast(`Se deja de seguir «${BANKLBL[e.pkg]||e.bankLabel}»`);
  }else{ S.sheet=null;render();toast('Movido a otros eventos'); }
}
function addLink(){S.sheet=null;render();toast('Grupo añadido');}
function createGroup(){S.sheet=null;render();toast('Grupo creado');}
function toggleSavings(id){const G0=byId(id);G0.savings=!G0.savings;
  S.sheet=null;render();toast(G0.savings?'Ahora es un grupo de ahorro':'Vuelve a ser un grupo normal');}
function archiveGroup(id){const G0=byId(id);G0.archived=true;
  S.sheet=null;S.gid=null;S.sgid=null;render();toast(`«${G0.title}» archivado`);}
function grantNotif(){S.notifAccess=true;render();toast('Permiso concedido');}
function cycleLearn(){const k=Object.keys(LEARN);
  S.learn=k[(k.indexOf(S.learn)+1)%k.length];
  if(S.learn==='FULL'&&!S.banks.seen.includes('com.cabify.rider'))
    S.banks.seen=[...S.banks.seen,'com.cabify.rider'];
  render();}
function toggleBank(p){S.banks.disabled=S.banks.disabled.includes(p)
  ? S.banks.disabled.filter(x=>x!==p) : [...S.banks.disabled,p]; render();}
function watchBank(p){S.banks.known=[...S.banks.known,p];
  S.banks.seen=S.banks.seen.filter(x=>x!==p);render();}
function doUpdate(){S.updateAvailable=false;render();toast('Descargando la actualización…');}
function cyclePolicy(k){
  const cur=policyFor(k); S.policies[k]=POLICIES[(POLICIES.indexOf(cur)+1)%3]; render();}
function muteSource(src){
  const n=normSource(src); if(n&&!S.muted.includes(n)) S.muted.push(n);
  render(); toast(`«${src}» silenciado`);}
function unmute(n){S.muted=S.muted.filter(x=>x!==n);render();}
function muteFromSheet(src){S.sheet=null;render();muteSource(src);}
function editOwnName(){S.sheet='ownname';S.form={name:S.ownName};render();}
function saveOwnName(){S.ownName=(S.form.name||'').trim();S.sheet=null;render();
  toast(S.ownName?'Se ignorarán los movimientos entre tus cuentas':'Nombre borrado');}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);}
setTheme(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
render();

// ---- Animación de carga (1 s), idéntica a la de Android ----
(function splash(){
  const BAR="M26.50,49.50 H81.50 A4.50,4.50 0 0 1 86.00,54.00 V54.00 A4.50,4.50 0 0 1 81.50,58.50 H26.50 A4.50,4.50 0 0 1 22.00,54.00 V54.00 A4.50,4.50 0 0 1 26.50,49.50 Z";
  const STEM="M38.50,31.50 H38.50 A4.50,4.50 0 0 1 43.00,36.00 V72.00 A4.50,4.50 0 0 1 38.50,76.50 H38.50 A4.50,4.50 0 0 1 34.00,72.00 V36.00 A4.50,4.50 0 0 1 38.50,31.50 Z";
  const DUP="M64.70,38.50 a6.30,6.30 0 1 0 12.60,0 a6.30,6.30 0 1 0 -12.60,0 Z";
  const DDN="M64.70,69.50 a6.30,6.30 0 1 0 12.60,0 a6.30,6.30 0 1 0 -12.60,0 Z";
  const decQuint=t=>1-Math.pow(1-t,5), decCubic=t=>1-Math.pow(1-t,3);
  const overshoot=(t,s=2)=>{t-=1;return t*t*((s+1)*t+s)+1;};
  const cl=v=>Math.max(0,Math.min(1,v));
  const el=document.getElementById('splash'), svg=document.getElementById('splash-svg');
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#0B0B0D';
  const accent='#4A6CFF';
  const t0=performance.now();
  function tick(now){
    const ms=now-t0;
    const bx=decQuint(cl(ms/360));
    const sy=decQuint(cl((ms-220)/340));
    const d=overshoot(cl((ms-420)/420));
    const dSc=0.2+0.8*d, dTy=15.5*(1-d);
    const a=decCubic(cl(ms/200));
    svg.innerHTML=`
      <g transform="translate(54,54) scale(${bx},1) translate(-54,-54)">
        <path d="${BAR}" fill="${ink}" fill-opacity="${a}"/></g>
      <g transform="translate(38.5,54) scale(1,${sy}) translate(-38.5,-54)">
        <path d="${STEM}" fill="${ink}" fill-opacity="${a}"/></g>
      <g transform="translate(0,${dTy}) translate(71,38.5) scale(${dSc}) translate(-71,-38.5)">
        <path d="${DUP}" fill="${accent}"/></g>
      <g transform="translate(0,${-dTy}) translate(71,69.5) scale(${dSc}) translate(-71,-69.5)">
        <path d="${DDN}" fill="${accent}"/></g>`;
    if(ms<1000) requestAnimationFrame(tick);
    else { window.__splashMs = ms; el.classList.add('out'); setTimeout(()=>el.remove(),260); }
  }
  requestAnimationFrame(tick);
})();

// ---- Notificación de movimiento detectado ----
//
// Tres botones, que son las tres cosas que se hacen con un cargo recién
// detectado: llevarlo al grupo normal más reciente, al de ahorro más
// reciente, o decidirlo tú. **Ninguno envía nada a Tricount**: los tres abren
// la app con el movimiento preparado, porque un cargo casi nunca llega listo
// para guardar y lo que se ganaba en un toque se perdía luego corrigiendo.
//
// Son tres y no cuatro porque Android enseña como mucho tres acciones: la
// cuarta se añade y no se ve. Silenciar un comercio se hace desde la hoja.
const lastMovementAt = g0 => active(g0).reduce((m,t)=>t.date>m?t.date:m,'');
function mostRecent(savings){
  const pool=G.filter(x=>!x.archived && !!x.savings===savings);
  return pool.slice().sort((a,b)=>lastMovementAt(b).localeCompare(lastMovementAt(a)))[0] || null;
}
function candidateGroups(){
  return [mostRecent(false), mostRecent(true)].filter(Boolean);
}
function simulateDetection(){
  const e={id:900+Math.floor(Math.random()*90),detectedAt:Date.now(),bankLabel:'Trade Republic',
    pkg:'de.traderepublic.app',rawTitle:'Transfer received',
    rawText:'BEN TORRES sent you a Bizum of 18.00 €.',
    amount:18,currency:'EUR',counterparty:'Ben Torres',merchant:null,concept:null,
    kind:'BIZUM_RECEIVED'};
  INBOX=[e,...INBOX]; S.notif={entry:e}; render();}
/** Un botón de grupo: abre la app en la bandeja con ese grupo ya elegido. */
function notifPick(gid){
  const e=S.notif.entry; S.notif=null; S.tab='inbox'; S.selId=gid; render();
  openAssign(e.id,gid);}
function notifOpen(){
  const e=S.notif.entry; S.notif=null; S.tab='inbox'; render(); openAssign(e.id);}
function notifDismiss(){S.notif=null;render();}
function renderNotif(){
  if(!S.notif) return '<div class="notif" id="notif"></div>';
  const {entry}=S.notif;
  const gs=candidateGroups();
  return `<div class="notif on" id="notif"><div class="app">${mark(15)}<span>SMARTCOUNT</span></div>
    <div class="nt">${KIND_LABEL[entry.kind]} ${eur(entry.amount)} · ${entry.merchant||entry.counterparty}</div>
    <div class="nb">${entry.concept?'«'+entry.concept+'» · ':''}¿a qué grupo lo llevas?</div>
    <div class="acts">${gs.map(g0=>`<button class="primary" id="notif-g${g0.id}"
      onclick="notifPick(${g0.id})">${g0.savings?'Ahorro: ':''}${g0.title}</button>`).join('')}
      <button id="notif-choose" onclick="notifOpen()">Elegir…</button></div></div>`;}

function screenHome(){
  const g0=g(), b=balances(g0), mine=b[nameOf(g0,g0.activeMembershipUuid)]||0;
  return `<div class="home"><div class="wgrid">
     <div class="w-balance" id="w-balance">
       <div class="wg">${g0.emoji} ${g0.title}</div>
       <div class="wa ${mine<0?'neg':'pos'}">${eur(mine,true)}</div>
       <div class="wl">${mine>=0?'te deben':'debes'}</div>
       <div class="wr"><button id="w-add-expense" onclick="widgetNewExpense()">+ Gasto</button>
       <button id="w-inbox" onclick="widgetInbox()"${pendingMovements().length?' style="color:var(--brand)"':''}>Bandeja${pendingMovements().length?' '+pendingMovements().length:''}</button></div>
     </div>
     <button class="w-add" id="w-quickadd" onclick="widgetNewExpense()">
       <span class="plus">+</span><span class="lbl2">Gasto</span></button>
   </div></div>
   <div class="homebar"><button onclick="setTab('settings')">Volver a SmartCount</button></div>`;}
function widgetNewExpense(){S.tab='groups';S.gid=S.selId;render();openCreate();}
function widgetInbox(){S.tab='inbox';render();}
window.__S=S; window.__G=G; window.__INBOX=()=>INBOX;
window.__stats={balances,settlement,totalSpent,byCategory,savingsSummary};
// El botón atrás del móvil no existe en un navegador: las comprobaciones lo
// llaman por aquí.
window.__back=androidBack;
window.__classOf=e=>classOf(e);
</script></body></html>
