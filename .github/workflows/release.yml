name: Publicar APK

# Un push a main acaba convertido en una actualización instalada en el móvil.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'sim/**'
      - 'prototipo-ui.html'
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: true   # un push nuevo cancela el anterior

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # necesario para crear la release

    steps:
      - uses: actions/checkout@v5
        with:
          # Obligatorio: el checkout por defecto es superficial y
          # `git rev-list --count HEAD` devolvería 1.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar el keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SMARTCOUNT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret SMARTCOUNT_KEYSTORE_BASE64. Créalo en Settings → Secrets and variables → Actions, pestaña Secrets (no Variables)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/smartcount-release.jks"
          size=$(stat -c%s "$RUNNER_TEMP/smartcount-release.jks")
          echo "::notice::Keystore restaurado, $size bytes"
          if [ "$size" -lt 1000 ]; then
            echo "::error::El keystore restaurado ocupa $size bytes: el base64 del secret está truncado."
            exit 1
          fi

      - name: Calcular la versión
        id: meta
        run: |
          versionCode=$(git rev-list --count HEAD)
          versionName=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"
          echo "versionName=$versionName" >> "$GITHUB_OUTPUT"
          echo "::notice::SmartCount $versionName (build $versionCode)"

      - name: Compilar la APK firmada
        env:
          SMARTCOUNT_STORE_FILE: ${{ runner.temp }}/smartcount-release.jks
          SMARTCOUNT_STORE_PASSWORD: ${{ secrets.SMARTCOUNT_STORE_PASSWORD }}
          SMARTCOUNT_KEY_ALIAS: ${{ secrets.SMARTCOUNT_KEY_ALIAS }}
          SMARTCOUNT_KEY_PASSWORD: ${{ secrets.SMARTCOUNT_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Comprobar que la APK va firmada
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No se generó $apk. Si existe app-release-unsigned.apk, la firma no se aplicó: revisa los secrets."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/smartcount-${{ steps.meta.outputs.versionName }}-b${{ steps.meta.outputs.versionCode }}.apk"
          echo "::notice::APK lista: $(du -h dist/*.apk | cut -f1)"

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.versionName }}-b${{ steps.meta.outputs.versionCode }}
          name: SmartCount ${{ steps.meta.outputs.versionName }} (build ${{ steps.meta.outputs.versionCode }})
          body: ${{ github.event.head_commit.message }}
          files: dist/*.apk
